  function acctRow(a) {
    const money1 = [a.unbilledCount ? `${whole(a.unbilled)} unbilled` : '', a.openCount ? `${whole(a.open)} owed` : ''].filter(Boolean).join(' &middot; ');
    const badge = a.late ? `<span class="stlabel fix">${ICON.fix} Late</span>`
      : a.unpriced ? '<span class="stlabel fix">Needs price</span>'
      : a.unbilledCount ? '<span class="stlabel watch">To bill</span>'
      : a.openCount ? '<span class="stlabel none">Billed</span>'
      : `<span class="stlabel good">${ICON.good} Paid up</span>`;
    return `<div class="item row acct" onclick="openAccount('${esc(a.id)}')">
      <div class="grow"><div style="font-weight:700">${esc(a.name)}</div>
        <div class="muted">${plural(a.properties, 'property')}${money1 ? ' &middot; ' + money1 : ''}</div></div>
      ${badge}<span class="chev">&rsaquo;</span></div>`;
  }

  async function openAccount(customerId) {
    if (S.busy) return;
    setBusy(true, 'Opening account...');
    try { S.acct = await call('customerAccount', customerId); }
    catch (e) { setBusy(false); if (!(e && e.message === 'WRONG_PIN')) toast((e && e.message) || String(e), true); return; }
    setBusy(false);
    renderAccount();
  }

  function renderAccount() {
    const A = S.acct, c = A.customer;
    let lastProp = null;
    const lines = A.unbilled.map(u => {
      const head = u.propertyLabel !== lastProp ? `<div class="grp">${esc(u.propertyLabel)}</div>` : '';
      lastProp = u.propertyLabel;
      return head + (u.unpriced ? `
        <div class="pick off" style="cursor:default">
          <input type="checkbox" disabled>
          <div class="grow"><div style="font-weight:700">${esc(u.description)}${u.qty > 1 ? ' x' + u.qty : ''}</div><div class="muted">${niceDate(u.date)}${u.doneBy ? ' &middot; ' + esc(u.doneBy) : ''}</div></div>
          <button class="btn gold sm" onclick="closeSheet(); openPricing()">Set price</button>
        </div>` : `
        <label class="pick">
          <input type="checkbox" value="${esc(u.id)}" data-amt="${u.amount}" checked onchange="updateBillBtn()">
          <div class="grow"><div style="font-weight:700">${esc(u.description)}${u.qty > 1 ? ' x' + u.qty : ''}</div><div class="muted">${niceDate(u.date)}${u.doneBy ? ' &middot; ' + esc(u.doneBy) : ''}</div></div>
          <div class="amt">${money(u.amount)}</div>
          <button class="x edit" title="Edit" onclick="event.preventDefault(); event.stopPropagation(); editLine('${esc(u.id)}')">&#9998;</button>
          <button class="x" title="Remove" onclick="event.preventDefault(); event.stopPropagation(); removeLine('${esc(u.id)}')">&#10005;</button>
        </label>`);
    }).join('');
    openSheet(`
      <h3>${esc(c.name)}</h3>
      <div class="muted" style="margin:-6px 0 6px">${c.email ? esc(c.email) : '<span style="color:#ffaa9e">No email: bills are handed over</span>'}</div>

      <div class="sec">Not billed yet</div>
      <div class="card list" style="padding:4px 14px">${A.unbilled.length ? lines : '<div class="empty">Nothing waiting to be billed.</div>'}</div>
      <button class="btn ghost" style="width:100%;margin-top:10px" onclick="addLine()">+ Add a job</button>
      ${A.unbilled.some(u => !u.unpriced) ? `<label class="field" style="margin-top:12px"><span>Note on the bill (optional)</span>
          <textarea class="input" id="billNote" style="min-height:64px" placeholder="Thanks for a great season! See you in the spring."></textarea></label>
        <button class="btn gold big" id="billBtn" style="margin-top:4px" onclick="billChecked()"></button>
        <div class="muted" style="margin:8px 2px 0" id="billMath"></div>` : ''}

      <div class="sec">Open bills</div>
      <div class="card list">
        ${A.open.length ? A.open.map(i => `
          <div class="item">
            <div class="row"><div class="grow"><div style="font-weight:800">#${esc(i.id)} &middot; ${niceDate(i.invoiceDate)}</div>
              <div class="muted">${i.paid ? money(i.paid) + ' paid so far &middot; ' : ''}${i.daysLate ? `<span style="color:#ffaa9e">${plural(i.daysLate, 'day')} late</span>` : 'Due ' + niceDate(i.dueDate)}</div></div>
              <div style="text-align:right"><div class="amt">${money(i.balance)}</div>${i.paid ? '<span class="badge hand">Part paid</span>' : ''}</div></div>
            <div class="actions">
              <button class="btn gold sm" onclick="closeSheet(); openPay('${esc(i.id)}')">Got paid</button>
              ${i.pdfUrl ? `<a class="btn ghost sm" href="${i.pdfUrl}" target="_blank">PDF</a>` : ''}
              ${i.email ? `<button class="btn ghost sm" onclick="resend('${esc(i.id)}')">Resend</button>` : ''}
              ${i.paid ? '' : `<button class="btn danger sm" onclick="askVoid('${esc(i.id)}')">Void</button>`}
            </div>
          </div>`).join('') : '<div class="empty">Nothing open. All paid up.</div>'}
      </div>

      <div class="sec">Paid</div>
      <div class="card list">
        ${A.paid.length ? A.paid.map(i => `
          <div class="item row"><div class="grow"><div style="font-weight:700">#${esc(i.id)} &middot; ${niceDate(i.invoiceDate)}</div>
            <div class="muted">${i.paidDate ? 'Paid ' + niceDate(i.paidDate) : 'Paid'}</div></div>
            <div style="text-align:right"><div class="amt">${money(i.total)}</div><span class="badge ok">&#10003; Paid</span></div></div>`).join('') : '<div class="empty">No paid bills yet.</div>'}
      </div>
      <button class="btn ghost big" onclick="closeSheet()">Close</button>`);
    updateBillBtn();
  }

  async function removeLine(id) {
    if (!await ask('Delete this line? It will not be billed.', 'Delete', true)) return;
    const cid = S.acct.customer.id;
    if (await run('voidWork', [id], 'Removed')) { openAccount(cid); if (S.tab === 'dash') loadDash(); }
  }

  /** Properties on the open account (inactive ones too, so old lines can still be moved). */
  const acctProps = () => S.data.properties.filter(p => p.customerId === S.acct.customer.id).sort((a, b) => String(a.label).localeCompare(String(b.label)));
  const propOptions = cur => acctProps().map(p => `<option value="${esc(p.id)}" ${p.id === cur ? 'selected' : ''}>${esc(p.label)}</option>`).join('');

  /** Edit everything on one unbilled line: property, date, description, qty, price. Delete is here too. */
  function editLine(id) {
    const u = S.acct.unbilled.find(x => x.id === id);
    if (!u) return;
    const prop = acctProps().find(p => p.label === u.propertyLabel);
    const each = u.amount === null ? '' : Math.abs(u.amount / (u.qty || 1)).toFixed(2);
    openSheet(`
      <h3>Edit line</h3>
      ${u.amount < 0 ? '<div class="muted" style="margin:-6px 0 10px">This is a credit. It comes off the bill.</div>' : ''}
      <label class="field"><span>Property</span><select class="input" id="elProp">${propOptions(prop ? prop.id : '')}</select></label>
      <label class="field"><span>Date</span><input class="input" id="elDate" type="date" value="${esc(u.date)}" max="${S.data.today}"></label>
      <label class="field"><span>Description (prints on the bill)</span><input class="input" id="elDesc" value="${esc(u.description)}"></label>
      ${u.qty > 1 ? `<div class="two">
        <label class="field"><span>Qty</span><input class="input" id="elQty" type="number" inputmode="numeric" min="1" step="1" value="${u.qty}"></label>
        <label class="field"><span>${u.amount < 0 ? 'Credit' : 'Price'} each</span><input class="input" id="elPrice" type="number" inputmode="decimal" step="0.01" value="${each}"></label>
      </div>` : `<label class="field"><span>${u.amount < 0 ? 'Credit amount' : 'Price'}</span><input class="input" id="elPrice" type="number" inputmode="decimal" step="0.01" value="${each}"></label>`}
      <div class="row">
        <button class="btn ghost grow" onclick="renderAccount()">Back</button>
        <button class="btn gold grow" onclick="saveLine('${esc(u.id)}')">Save</button>
      </div>
      <button class="btn danger big" style="margin-top:12px" onclick="removeLine('${esc(u.id)}')">Delete this line</button>`);
  }

  async function saveLine(id) {
    const cid = S.acct.customer.id;
    const ok = await run('editWork', { id, propertyId: $('elProp').value, date: $('elDate').value, description: $('elDesc').value, qty: $('elQty') ? $('elQty').value : 1, price: $('elPrice').value }, 'Saved');
    if (ok) { openAccount(cid); if (S.tab === 'dash') loadDash(); }
  }

  /** Add a job straight onto this customer's account: any property, any past date, any price. */
  function addLine() {
    const props = acctProps().filter(p => p.ownActive !== false);
    if (!props.length) { toast('This customer has no property yet. Add one in Settings.', true); return; }
    const items = S.data.prices.filter(p => p.active !== false);
    openSheet(`
      <h3>Add a job</h3>
      <label class="field"><span>Property</span><select class="input" id="alProp" onchange="fillAddPrice()">${propOptions(props[0].id)}</select></label>
      <label class="field"><span>Date</span><input class="input" id="alDate" type="date" value="${S.data.today}" max="${S.data.today}"></label>
      <label class="field"><span>What</span><select class="input" id="alItem" onchange="fillAddPrice()">
        ${items.map(p => `<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}
        <option value="CUSTOM">Other (type it below)</option>
        <option value="CREDIT">Credit (comes off the bill)</option>
      </select></label>
      <label class="field"><span>Description (prints on the bill)</span><input class="input" id="alDesc" placeholder="Blank = the item name"></label>
      <label class="field"><span id="alPriceLbl">Price</span><input class="input" id="alPrice" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></label>
      <div class="row">
        <button class="btn ghost grow" onclick="renderAccount()">Back</button>
        <button class="btn gold grow" onclick="saveNewLine()">Add</button>
      </div>`);
    fillAddPrice();
  }

  /** Prefill the price: the property's mowing rate, the item's set price, or the last price charged there. */
  function fillAddPrice() {
    const pid = $('alProp').value, id = $('alItem').value, prop = propById(pid), item = priceById(id), lp = S.data.lastPrices || {};
    $('alPriceLbl').textContent = id === 'CREDIT' ? 'Credit amount' : 'Price';
    let v = 0;
    if (id === MOWING && prop && prop.mowRate > 0) v = prop.mowRate;
    else if (item && item.price > 0) v = item.price;
    else v = lp[pid + '|' + id] || lp[id] || 0;
    $('alPrice').value = v > 0 ? Number(v).toFixed(2) : '';
  }

  async function saveNewLine() {
    const cid = S.acct.customer.id;
    const ok = await run('addWork', { propertyId: $('alProp').value, date: $('alDate').value, itemId: $('alItem').value,
      description: $('alDesc').value, qty: 1, price: $('alPrice').value }, 'Added');
    if (ok) { openAccount(cid); if (S.tab === 'dash') loadDash(); }
  }

  /** Void an unpaid bill. Fix = its work goes back to "Not billed" to correct and bill again. Drop = the work goes too. */
  function askVoid(invoiceId) {
    const i = S.acct.open.find(x => String(x.id) === String(invoiceId));
    openSheet(`
      <h3>Void bill #${esc(invoiceId)}?</h3>
      <div class="muted" style="margin:-6px 0 14px">${i ? money(i.balance) + ' &middot; ' + niceDate(i.invoiceDate) + '. ' : ''}It stays in the records marked Void and stops late reminders.
        The customer is <b>not</b> emailed, so tell them the old bill is cancelled.</div>
      <button class="btn gold big" onclick="doVoid('${esc(invoiceId)}', false)">Void and fix the work</button>
      <div class="muted" style="margin:6px 2px 14px">The work goes back to "Not billed" so you can edit it and bill again.</div>
      <button class="btn danger big" onclick="doVoid('${esc(invoiceId)}', true)">Void and delete the work</button>
      <div class="muted" style="margin:6px 2px 14px">For a bill that should never have gone out.</div>
      <button class="btn ghost big" onclick="renderAccount()">Cancel</button>`);
  }

  async function doVoid(invoiceId, dropWork) {
    const cid = S.acct.customer.id;
    if (await run('voidInvoice', { invoiceId, dropWork }, 'Bill #' + invoiceId + ' voided')) { openAccount(cid); if (S.tab === 'dash') loadDash(); }
  }

  /** Same math as the server's invoiceMath_: tax once on the work subtotal, rounded once. */
  function billMath(subtotal) {
    const rate = S.acct ? S.acct.taxRate : S.data.taxRate;
    const tax = subtotal > 0 ? round2(subtotal * rate / 100) : 0;
    return { subtotal: round2(subtotal), rate, tax, total: round2(subtotal + tax) };
  }

  function updateBillBtn() {
    const btn = $('billBtn');
    if (!btn) return;
    const items = sheetChecked();
    const m = billMath(items.reduce((t, i) => t + Number(i.dataset.amt), 0));
    btn.disabled = !items.length || m.subtotal <= 0;
    btn.textContent = !items.length ? 'Check items to bill' : m.subtotal <= 0 ? 'Credits cover this. Check more work.' : `Bill ${plural(items.length, 'item')}  ${money(m.total)}`;
    $('billMath').textContent = items.length && m.subtotal > 0 ? `${money(m.subtotal)} work + ${money(m.tax)} tax (${m.rate}%) = ${money(m.total)}. Unchecked items stay here for later.` : 'Unchecked items stay here for later.';
  }

  async function billChecked() {
    const c = S.acct.customer, items = sheetChecked();
    if (!items.length) return;
    const m = billMath(items.reduce((t, i) => t + Number(i.dataset.amt), 0));
    const how = c.email ? `and email it to ${c.email}` : '(no email on file, so you will hand them the PDF)';
    if (!await ask(`Create one bill for ${money(m.total)} ${how}?`, 'Create bill')) return;
    setBusy(true, 'Creating the bill...');
    try {
      const res = await call('billSelected', { customerId: c.id, entryIds: items.map(i => i.value), message: $('billNote') ? $('billNote').value : '' });
      setData(res);
      const b = res.billed;
      toast(b.emailed ? `Bill #${b.id} sent to ${b.email}` : `Bill #${b.id} created. Hand them the PDF.`);
      S.acct = await call('customerAccount', c.id);
      renderAccount();
      loadDash();
    } catch (e) {
      if (!(e && e.message === 'WRONG_PIN')) toast((e && e.message) || String(e), true);
    } finally {
      setBusy(false);
    }
  }

    if (!i.email) return '<span class="badge hand">Hand deliver</span>';
    if (!i.emailed) return '<span class="badge late">Not emailed</span>';
    if (i.daysLate > 0) return `<span class="badge late">${plural(i.daysLate, 'day')} late</span>`;
    return `<span class="badge">Due ${niceDate(i.dueDate)}</span>`;
  }

        <div class="money-big">${money(owed)}</div>
        <div class="muted">${plural(open.length, 'open bill')}${late ? ' &middot; <span style="color:#ffaa9e">' + late + ' late</span>' : ''}</div>

              <div class="muted">#${esc(i.id)} &middot; ${niceDate(i.invoiceDate)}${i.paid ? ' &middot; ' + money(i.paid) + ' paid so far' : ''}</div></div>
            <div style="text-align:right"><div class="amt">${money(i.balance)}</div>${i.paid ? '<span class="badge hand">Part paid</span><br>' : ''}${invoiceBadge(i)}</div>
          </div>
          <div class="actions">

      <div class="lbl">Recently paid</div>
      <div class="card list">${d.paidInvoices.length ? d.paidInvoices.map(i => `

          <div style="text-align:right"><div class="amt">${money(i.total)}</div><span class="badge ok">&#10003; Paid</span></div>
        </div>`).join('') : '<div class="empty">No paid bills yet.</div>'}

  const REF_LABEL = { Check: 'Check # (optional)', Venmo: 'Venmo note or name (optional)' };

  function openPay(id) {
    const i = S.data.openInvoices.find(x => x.id === id);
    if (!i) return;
    S.payMethod = 'Cash';
    openSheet(`
      <h3>Got paid</h3>
      <div class="muted" style="margin:-6px 0 16px">${esc(i.customerName)} &middot; Bill #${esc(i.id)} &middot; balance ${money(i.balance)}</div>
      <label class="field"><span>Amount</span>
        <input class="input" id="payAmt" type="number" inputmode="decimal" step="0.01" value="${i.balance.toFixed(2)}"></label>
      <div class="field"><span>How</span>
        <div class="seg" id="paySeg">
          <button class="on" onclick="setPayMethod('Cash')">Cash</button>
          <button onclick="setPayMethod('Check')">Check</button>
          <button onclick="setPayMethod('Venmo')">Venmo</button>
        </div>
      </div>
      <label class="field" id="refWrap" style="display:none"><span id="refLbl"></span><input class="input" id="payRef"></label>
      <label class="field"><span>Date received</span>
        <input class="input" id="payDate" type="date" value="${S.data.today}" max="${S.data.today}"></label>
      <div class="row" style="margin-top:8px">
        <button class="btn ghost grow" onclick="closeSheet()">Cancel</button>
        <button class="btn gold grow" onclick="savePayment('${esc(i.id)}')">Save</button>
      </div>`);
  }

  function setPayMethod(m) {
    S.payMethod = m;
    document.querySelectorAll('#paySeg button').forEach(b => b.classList.toggle('on', b.textContent === m));
    $('refWrap').style.display = REF_LABEL[m] ? '' : 'none';
    $('refLbl').textContent = REF_LABEL[m] || '';
    $('payRef').setAttribute('inputmode', m === 'Check' ? 'numeric' : 'text');
  }

  async function savePayment(id) {
    const ok = await run('recordPayment', {
      invoiceId: id, amount: $('payAmt').value, method: S.payMethod, ref: S.payMethod === 'Cash' ? '' : $('payRef').value, date: $('payDate').value,
    }, 'Payment saved');
    if (ok) { closeSheet(); if (S.tab === 'dash') loadDash(); }
  }

  async function resend(id) {
    if (!await ask('Email bill #' + id + ' again?', 'Send')) return;
    run('resendInvoice', id, 'Bill sent');
  }

        <button class="btn gold sm" style="margin-top:12px" onclick="editCustomer('')">+ Add customer</button>
      </div>

      <div class="lbl">Prices</div>
      <div class="card list">
        ${d.prices.map(p => `
          <div class="item row tap" onclick="editPrice('${p.id}')">
            <div class="grow"><div style="font-weight:800${p.active ? '' : ';opacity:.45'}">${esc(p.name)}</div><div class="muted">${p.kind === 'Service' ? 'Main service' : 'Extra'}${p.active ? '' : ' &middot; hidden'}${p.id === MOWING ? ' &middot; each property can have its own rate' : ''}</div></div>
            <div class="amt">${p.price > 0 ? money(p.price) : '<span class="muted">Varies</span>'}</div>
          </div>`).join('')}
        <button class="btn ghost sm" style="margin-top:12px" onclick="editPrice('')">+ Add item</button>
      </div>
      <div class="muted" style="margin:8px 2px 0">Price changes apply to work logged from now on.</div>

      <div class="lbl">Crew</div>
      <div class="card list">
        ${d.crew.map(c => `
          <div class="item row tap" onclick="editCrew('${c.id}')">
            <div class="grow"><div style="font-weight:800${c.active ? '' : ';opacity:.45'}">${esc(c.name)}</div>
              <div class="muted">${c.pin ? 'Has a PIN: logs on their own phone' : 'No PIN: pick them under Done by'}${c.active ? '' : ' &middot; inactive'}</div></div>
            <div style="color:var(--brass)">&rsaquo;</div></div>`).join('') || '<div class="muted" style="padding:4px 0 8px">Just you for now. Add a helper and they can log their own work without seeing any money.</div>'}
        <button class="btn ghost sm" style="margin-top:12px" onclick="editCrew('')">+ Add crew member</button>
      </div>

      <div class="lbl">Business info</div>
      <div class="card">
        <label class="field"><span>Business name</span><input class="input" id="setBiz" value="${esc(st.BUSINESS_NAME)}"></label>
        <label class="field"><span>Your name (signs emails)</span><input class="input" id="setOwner" value="${esc(st.OWNER_NAME)}"></label>
        <label class="field"><span>Phone</span><input class="input" id="setPhone" type="tel" value="${esc(st.BUSINESS_PHONE)}"></label>
        <label class="field"><span>Your email (copies and replies)</span><input class="input" id="setEmail" type="text" inputmode="email" autocapitalize="off" value="${esc(st.BUSINESS_EMAIL)}" placeholder="Blank = the app's Gmail"></label>
        <label class="field"><span>Checks payable to</span><input class="input" id="setPayable" value="${esc(st.CHECKS_PAYABLE_TO)}" placeholder="${esc(st.BUSINESS_NAME)}"></label>
        <label class="field"><span>Mail checks to (optional)</span><input class="input" id="setMail" value="${esc(st.MAILING_ADDRESS)}"></label>
        <label class="field"><span>Venmo username (no @)</span><input class="input" id="setVenmo" autocapitalize="off" value="${esc(st.VENMO_HANDLE)}" placeholder="Blank = no Venmo on bills"></label>
        <div class="two">
          <label class="field"><span>Payment due (days)</span><input class="input" id="setTerms" type="number" inputmode="numeric" value="${esc(st.TERMS_DAYS)}"></label>
          <label class="field"><span>Sales tax %</span><input class="input" id="setTax" type="number" inputmode="decimal" step="0.01" value="${esc(st.TAX_RATE)}"></label>
        </div>
        <label class="field"><span>Tax line name</span><input class="input" id="setTaxLabel" value="${esc(st.TAX_LABEL)}"></label>
        <div class="switch">
          <div><div style="font-weight:800">Pause automation</div><div class="muted">Stops late reminders from going to customers</div></div>
          <input type="checkbox" id="setPaused" ${st.AUTOMATION_PAUSED ? 'checked' : ''}>
        </div>
        <button class="btn gold" style="width:100%" onclick="saveSettings()">Save business info</button>
      </div>
      <div style="text-align:center;margin-top:14px"><button class="link" onclick="signOut()">Sign out of this phone</button></div>`;
  }

  function filterCustomers(q) {
    const words = String(q || '').toLowerCase().split(/\s+/).filter(Boolean);
    document.querySelectorAll('#custList .item').forEach(el => { el.style.display = words.every(w => el.dataset.s.indexOf(w) >= 0) ? '' : 'none'; });
  }

  const serviceOptions = cur => ['Weekly', 'Every 2 weeks', 'Jobs only'].map(s => `<option ${cur === s ? 'selected' : ''} value="${s}">${s === 'Jobs only' ? 'Jobs only (no mowing)' : s + ' mowing'}</option>`).join('');
  const dayOptions = cur => [''].concat(['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat']).map(s => `<option ${cur === s ? 'selected' : ''} value="${s}">${s || 'Any day'}</option>`).join('');

  /** Property fields, shared by the new-customer form (prefix "fp") and the property form (prefix "pp"). */
  const propFields = (x, p) => `
    <label class="field"><span>Address</span><input class="input" id="${x}Address" value="${esc(p.address)}" placeholder="22 Main St, Pottstown"></label>
    <label class="field"><span>Short name (optional)</span><input class="input" id="${x}Label" value="${esc(p.label)}" placeholder="Blank = the street address"></label>
    <label class="field"><span>Service</span><select class="input" id="${x}Service">${serviceOptions(p.service || 'Weekly')}</select></label>
    <div class="two">
      <label class="field"><span>Mowing rate</span><input class="input" id="${x}Rate" type="number" inputmode="decimal" step="0.01" value="${p.mowRate ? Number(p.mowRate).toFixed(2) : ''}" placeholder="$ per cut"></label>
      <label class="field"><span>Mow day</span><select class="input" id="${x}Day">${dayOptions(p.mowDay || '')}</select></label>
    </div>`;
  /** A mowing rate under $5 is almost surely a typo (0.05 for 80). Returns true if OK to save. */
  function rateLooksOk(x) {
    const r = Number($(x + 'Rate').value);
    if (r > 0 && r < 5) { toast('Mowing rate $' + r.toFixed(2) + ' looks like a typo. Fix it or leave it blank.', true); $(x + 'Rate').focus(); return false; }
    return true;
  }
  const readProp = x => ({ address: $(x + 'Address').value, label: $(x + 'Label').value, service: $(x + 'Service').value, mowRate: $(x + 'Rate').value, mowDay: $(x + 'Day').value });

  function editCustomer(id) {
    const c = id ? custById(id) : { id: '', name: '', email: '', phone: '', address: '', active: true, notes: '' };
    const props = id ? S.data.properties.filter(p => p.customerId === id).sort(byLabel) : [];
    openSheet(`
      <h3>${id ? 'Edit customer' : 'New customer'}</h3>
      <label class="field"><span>Name (who pays)</span><input class="input" id="cName" value="${esc(c.name)}"></label>
      <label class="field"><span>Email (bills go here)</span><input class="input" id="cEmail" type="email" autocapitalize="off" value="${esc(c.email)}"></label>
      <label class="field"><span>Phone</span><input class="input" id="cPhone" type="tel" value="${esc(c.phone)}"></label>
      <label class="field"><span>Billing address (optional)</span><input class="input" id="cAddress" value="${esc(c.address)}" placeholder="Where the bill goes, if not the property"></label>
      <label class="field"><span>Notes</span><textarea class="input" id="cNotes">${esc(c.notes)}</textarea></label>
      ${id ? `<div class="switch"><div><div style="font-weight:800">Active</div><div class="muted">Inactive customers and their properties are hidden from Log</div></div><input type="checkbox" id="cActive" ${c.active ? 'checked' : ''}></div>`
        : `<div class="sec">First property</div>${propFields('fp', { service: 'Weekly' })}`}
      <div class="row">
        <button class="btn ghost grow" onclick="closeSheet()">Cancel</button>
        <button class="btn gold grow" onclick="saveCustomer('${c.id}')">Save</button>
      </div>
      ${id ? `
        <div class="sec">Properties</div>
        <div class="card list">
          ${props.map(p => `<div class="item row tap" onclick="editProperty('${p.id}')">
            <div class="grow"><div style="font-weight:800${p.ownActive ? '' : ';opacity:.45'}">${esc(p.label)}</div>
              <div class="muted">${esc(p.service)}${p.mowRate ? ' &middot; ' + money(p.mowRate) : ''}${p.mowDay ? ' &middot; ' + esc(p.mowDay) : ''}${p.ownActive ? '' : ' &middot; inactive'}</div></div>
            <div style="color:var(--brass)">&rsaquo;</div></div>`).join('') || '<div class="empty">No properties yet.</div>'}
          <button class="btn gold sm" style="margin-top:12px" onclick="editProperty('', '${c.id}')">+ Add property</button>
        </div>` : ''}`);
  }

  async function saveCustomer(id) {
    const payload = { id, name: $('cName').value, email: $('cEmail').value, address: $('cAddress').value, phone: $('cPhone').value,
      notes: $('cNotes').value, active: id ? $('cActive').checked : true };
    if (!id && !rateLooksOk('fp')) return;
    if (!id) payload.firstProperty = readProp('fp');
    if (await run('saveCustomer', payload, 'Saved')) closeSheet();
  }

  function editProperty(id, customerId) {
    const p = id ? propById(id) : { id: '', customerId, label: '', address: '', service: 'Weekly', mowRate: '', mowDay: '', ownActive: true, notes: '' };
    const custs = S.data.customers.slice().sort(byName);
    openSheet(`
      <h3>${id ? 'Edit property' : 'New property'}</h3>
      ${propFields('pp', p)}
      <label class="field"><span>Billed to</span><select class="input" id="ppCust">${custs.map(c => `<option value="${c.id}" ${c.id === p.customerId ? 'selected' : ''}>${esc(c.name)}</option>`).join('')}</select></label>
      <label class="field"><span>Notes (gate code, dog, where to dump)</span><textarea class="input" id="ppNotes">${esc(p.notes)}</textarea></label>
      ${id ? `<div class="switch"><div><div style="font-weight:800">Active</div><div class="muted">Inactive properties are hidden from Log</div></div><input type="checkbox" id="ppActive" ${p.ownActive ? 'checked' : ''}></div>` : ''}
      <div class="row">
        <button class="btn ghost grow" onclick="editCustomer('${p.customerId}')">Back</button>
        <button class="btn gold grow" onclick="saveProperty('${p.id}')">Save</button>
      </div>`);
  }

  async function saveProperty(id) {
    if (!rateLooksOk('pp')) return;
    const payload = Object.assign(readProp('pp'), { id, customerId: $('ppCust').value, notes: $('ppNotes').value, active: id ? $('ppActive').checked : true });
    if (await run('saveProperty', payload, 'Saved')) editCustomer(payload.customerId);
  }

  function editPrice(id) {
    const p = id ? priceById(id) : { id: '', name: '', price: '', kind: 'Service', active: true };
    openSheet(`
      <h3>${id ? 'Edit item' : 'New item'}</h3>
      <label class="field"><span>Name</span><input class="input" id="pName" value="${esc(p.name)}"></label>
      <label class="field"><span>Price</span><input class="input" id="pPrice" type="number" inputmode="decimal" step="0.01" value="${p.price > 0 ? Number(p.price).toFixed(2) : ''}" placeholder="Blank = price varies"></label>
      <div class="muted" style="margin:-6px 2px 14px;font-size:12px">${id === MOWING ? 'Each property\'s own mowing rate wins. This is only used for properties without one.' : 'Leave it blank if the price changes every job. The app asks each time and remembers the last price at that property.'}</div>
      <label class="field"><span>Shows as</span>
        <select class="input" id="pKind">
          <option ${p.kind === 'Service' ? 'selected' : ''} value="Service">Main service</option>
          <option ${p.kind === 'Extra' ? 'selected' : ''} value="Extra">Extra</option>
        </select></label>
      ${id ? `<div class="switch"><div style="font-weight:800">Show in the app</div><input type="checkbox" id="pActive" ${p.active ? 'checked' : ''}></div>` : ''}
      <div class="row">
        <button class="btn ghost grow" onclick="closeSheet()">Cancel</button>
        <button class="btn gold grow" onclick="savePrice('${p.id}')">Save</button>
      </div>`);
  }

  async function savePrice(id) {
    const ok = await run('savePrice', { id, name: $('pName').value, price: $('pPrice').value, kind: $('pKind').value, active: id ? $('pActive').checked : true }, 'Saved');
    if (ok) closeSheet();
  }

  function editCrew(id) {
    const c = id ? S.data.crew.find(x => x.id === id) : { id: '', name: '', pin: '', active: true, notes: '' };
    openSheet(`
      <h3>${id ? 'Edit crew member' : 'New crew member'}</h3>
      <label class="field"><span>Name</span><input class="input" id="kName" value="${esc(c.name)}"></label>
      <label class="field"><span>PIN (optional, 4 to 12 digits)</span><input class="input" id="kPin" inputmode="numeric" value="${esc(c.pin)}" placeholder="Blank = can not sign in"></label>
      <div class="muted" style="margin:-6px 2px 14px;font-size:12px">With a PIN they open this same app on their phone and see only the Log tab: Mow List, properties, and their own recent work. No prices, no money. Jobs that need a price come to you.</div>
      <label class="field"><span>Notes</span><textarea class="input" id="kNotes">${esc(c.notes)}</textarea></label>
      ${id ? `<div class="switch"><div><div style="font-weight:800">Active</div><div class="muted">Inactive = PIN stops working</div></div><input type="checkbox" id="kActive" ${c.active ? 'checked' : ''}></div>` : ''}
      <div class="row">
        <button class="btn ghost grow" onclick="closeSheet()">Cancel</button>
        <button class="btn gold grow" onclick="saveCrew('${c.id}')">Save</button>
      </div>`);
  }

  async function saveCrew(id) {
    const ok = await run('saveCrew', { id, name: $('kName').value, pin: $('kPin').value, notes: $('kNotes').value, active: id ? $('kActive').checked : true }, 'Saved');
    if (ok) closeSheet();
  }

  function saveSettings() {
    run('saveSettings', {
      BUSINESS_NAME: $('setBiz').value, OWNER_NAME: $('setOwner').value, BUSINESS_PHONE: $('setPhone').value,
      BUSINESS_EMAIL: $('setEmail').value, CHECKS_PAYABLE_TO: $('setPayable').value, MAILING_ADDRESS: $('setMail').value,
      VENMO_HANDLE: $('setVenmo').value, TERMS_DAYS: $('setTerms').value, TAX_RATE: $('setTax').value, TAX_LABEL: $('setTaxLabel').value,
      AUTOMATION_PAUSED: $('setPaused').checked,
    }, 'Saved');
  }

  /** Phones leave the app open for days. When it comes back on a new day, reload so "today",
   *  the Mow List and the Log date are not stuck on yesterday (Mowed taps log on today's date). */
  function localYmd() { const t = new Date(); return t.getFullYear() + '-' + String(t.getMonth() + 1).padStart(2, '0') + '-' + String(t.getDate()).padStart(2, '0'); }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && !DEMO && S.pin && S.data && S.data.today && S.data.today !== localYmd()) run('bootstrap');
  });

  // ---------------- Start ----------------
  /** The bill-day email links here with ?bills=1: land straight on Send Bills. */
  function afterBoot() {
    if (new URLSearchParams(location.search).get('bills') !== '1') return;
    history.replaceState(null, '', location.pathname);
    if (!owner()) return;
    showTab('dash');
    openSendBills('month');
  }

  if (DEMO) {
    document.body.classList.add('demo');
    S.pin = '9999';
    run('bootstrap').then(ok => { if (ok) toast('Demo: a made-up season for a growing landscaping company'); });
  } else if ((S.pin = loadPin())) {
    run('bootstrap').then(ok => { if (ok) afterBoot(); else if (!S.data && !$('pinGate').classList.contains('on')) showPinScreen('Could not connect. Try again.'); });
  } else {
    showPinScreen();
  }
</script>
</body>
</html>
